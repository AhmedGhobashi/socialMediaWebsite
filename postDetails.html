<script>
    let baseURL = "https://tarmeezacademy.com/api/v1";

    const urlParams = new URLSearchParams(window.location.search);
    console.log (urlParams);
    const id = urlParams.get("postId");
    console.log(id);


    getThePost();
    function getThePost(){
            axios.get(`${baseURL}/posts/${id}`).then((response)=>{

            console.log(post);

            let comments = post.comments;
            console.log(comments);

            if (comments != null){

                    console.log(comment_content);

                    console.log(comment_author);

                    // if(comment.author.profile_image != null && post.author.profile_image !=''){
                    //     comment_author_image = comment.author.profile_image;
                    // }

                commentsContent +=`

                        </div>
                    </div>
                                
                                
                            `;
                


                // document.getElementById("comments").innerHTML += daBody;
                // console.log(comments);
            }
            }
            




            let postTitle = '';

                }

        }

        
        function createCommentClicked(){

            let commentBody = document.getElementById("comment-input").value;
            let params = {"body":commentBody};
            let token = localStorage.getItem("token");
            let url = `${baseURL}/posts/${id}/comments`;

            axios.post(url, params, {headers:{"authorization":`Bearer ${token}`}})
            .then((response)=>{
                console.log(response.data);
                alertMessage("comment Added successfully", "success")
                getThePost();

            }).catch((error)=>{
                let errorMessage = error.response.data.message;
                console.log(errorMessage);
                alertMessage(errorMessage, "danger")
            })



        }


        // ALERT LOGIN SUCCESS (from bootstrap)
        function alertMessage(customMessage, type){
            const alertPlaceholder = document.getElementById('success-alert')
            const appendAlert = (message, type) => {
            const wrapper = document.createElement('div')
            wrapper.innerHTML = [
                `<div class="alert alert-${type} alert-dismissible" role="alert">`,
                `   <div>${message}</div>`,
                '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
                '</div>'
            ].join('')

            alertPlaceholder.append(wrapper)
            }

            appendAlert(customMessage, type)

            // todo: hiding the alert
            // setTimeout (()=>{

            // }, 2000)


        }
