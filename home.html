<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>

    <!-- IMPORT JAVASCRIPT BOOTSTRAP -->
     <script src="./node_modules/bootstrap/dist/js/bootstrap.min.js"></script>

<style>
    body{
        background-color: #f0ecff;
    }

    .card {
        margin-top: 30px;
    }

    #add-btn{
        position: fixed;
        right: 5%;
        bottom: 7%;

        width: 70px;
        cursor: pointer;
        border-radius: 100%;
        color: whitesmoke;
        font-size: 70px;
        text-align: center;
        line-height: 0.8;
        box-shadow: 0px 10px 10px rgba(0, 0, 0, 0.3);
    }
</style>

<body>

    <!-- MODALS -->
    <!-- LOGIN MODAL -->
     <div class="modal fade" id="login-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Login</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form>
                <div class="mb-3">
                    <label for="recipient-name" class="col-form-label">Username:</label>
                    <input type="text" class="form-control" id="username-login">
                </div>
                <div class="mb-3">
                    <label for="message-text" class="col-form-label">Password:</label>
                    <input type="password" class="form-control" id="password-login">
                </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="loginBtnClicked()">Login</button>
            </div>
            </div>
        </div>
     </div>
    <!-- LOGIN MODAL END -->

    <!-- ADD POST BUTTON -->
     <div class="bg-primary" id="add-btn" data-bs-toggle="modal" data-bs-target="#add-new-post-modal">+</div>
    <!-- END ADD POST BUTTON -->

        <!-- ADD NEW POST MODAL -->
     <div class="modal fade" id="add-new-post-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="post-modal-title">Create New Post</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form>
                <div class="mb-3">
                    <label for="recipient-name" class="col-form-label">Title:</label>
                    <input type="text" class="form-control" id="post-title">
                </div>

                <div class="mb-3">
                    <textarea  id="post-body" style="width:100%; height: 100px; border-radius: 10px; resize: none; border: 2px solid grey;">
                    </textarea>
                </div>

                <div class="mb-3">
                    <label for="recipient-name" class="col-form-label">Image:</label>
                    <input type="file" class="form-control" id="post-image">
                </div>

                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="createNewPost()">Post</button>
            </div>
            </div>
        </div>
     </div>
    <!-- END ADD  NEW POST MODAL -->

    <!-- REGISTER MODAL -->
     <div class="modal fade" id="register-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">register a new user</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                    <label for="recipient-name" class="col-form-label">Profile Image:</label>
                    <input type="file" class="form-control" id="register-image-input">
                </div>

                <div class="mb-3">
                    <label for="recipient-name" class="col-form-label">Name:</label>
                    <input type="text" class="form-control" id="register-name-input">
                </div>  

                <div class="mb-3">
                    <label for="recipient-name" class="col-form-label">Username:</label>
                    <input type="text" class="form-control" id="register-username-input">
                </div>

                <div class="mb-3">
                    <label for="message-text" class="col-form-label">E-mail:</label>
                    <input type="email" class="form-control" id="register-email-input">
                </div>

                <div class="mb-3">
                    <label for="message-text" class="col-form-label">Password:</label>
                    <input type="password" class="form-control" id="register-password-input">
                </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="registerBtnClicked()">SignUp</button>
            </div>
            </div>
        </div>
     </div>
    <!-- REGISTER MODAL END -->

    
    <!-- login alert -->
        <div id="success-alert" style="position: fixed; bottom : 0; right : 0; width:30%; z-index: 999; "></div>
    <!-- End login alert -->


    <!-- NAVIGATION BAR -->
    <div class="container " >
        <div class="d-flex justify-content-center">
            <div class="col-9">
                <nav class="navbar navbar-expand-lg bg-body-tertiary shadow rounded pt-2">
                    <div class="container-fluid">
                        <a class="navbar-brand" href="#">Ghobashi</a>
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                        <div class="navbar-nav">
                            <a class="nav-link active" aria-current="page" href="#">Home</a>
                            <a class="nav-link active" aria-current="page" href="#">Profile</a>
                        </div>
                        </div>

                        <!-- WHEN USER NOT-LOGIN -->
                        <div class="d-flex w-100 justify-content-end" id="not-logged-in-div">
                            <button type="button" data-bs-toggle="modal" data-bs-target="#login-modal" class="btn btn-outline-success mx-2" id="login-btn">Login</button>
                            <button type="button" class="btn btn-outline-info" id="register-btn" data-bs-toggle="modal" data-bs-target="#register-modal">Register</button>
                        </div>
                        <!-- END WHEN USER NOT-LOGIN -->

                        <!-- WHEN USER LOGEED IN -->
                        <div class="d-flex w-100 justify-content-end align-items-center" id="logged-in-div">
                            <img id="nav-user-image" src="./profile_pictures/user.jpg" class="rounded-circle" style=" width: 40px; height: 40px;" />

                            <b id="nav-username"></b>

                            <button  onclick="logout()" type="button" class="btn btn-outline-danger" id="logout-btn">logout</button>
                        </div>
                        <!-- END WHEN USER LOGGED IN -->

                    </div>
                </nav>
            </div>
        </div>
    </div>
    <!-- NAVIGATION BAR END -->

    <!-- MAIN CONTENT -->
    <div class="container">

        <div class="d-flex justify-content-center mt-3">
            <div class="col-9">
                <!-- POSTS -->
                    <div id="posts">
                        <!-- POST -->
                            <div class="card shadow">
                                <div class="card-header">
                                    <img src="./profile_pictures/spidy.jpg" style="width: 40px; height: 40px;" class="border border-2 rounded-circle"/>
                                    <bold>@ahmed</bold>
                                </div>
                                <div class="card-body">
                                    <img src="./placeholder/peter spidy.jpg" class="w-100"/>
                                    <h6 style="color: rgb(170, 170, 170);">2 min ago</h6>
                                    <h4>Fighting depression ^^</h4>
                                    <p>Hello there! I am Ahmed, pleased to meet you guys. <br/> I hope you stay safe and have the will to continue living in this world.</p>
                                    
                                    <hr/>

                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pen" viewBox="0 0 16 16">
                                        <path d="m13.498.795.149-.149a1.207 1.207 0 1 1 1.707 1.708l-.149.148a1.5 1.5 0 0 1-.059 2.059L4.854 14.854a.5.5 0 0 1-.233.131l-4 1a.5.5 0 0 1-.606-.606l1-4a.5.5 0 0 1 .131-.232l9.642-9.642a.5.5 0 0 0-.642.056L6.854 4.854a.5.5 0 1 1-.708-.708L9.44.854A1.5 1.5 0 0 1 11.5.796a1.5 1.5 0 0 1 1.998-.001m-.644.766a.5.5 0 0 0-.707 0L1.95 11.756l-.764 3.057 3.057-.764L14.44 3.854a.5.5 0 0 0 0-.708z"/>
                                    </svg>

                                    <span>
                                        (3) comments
                                    </span>
                                </div>
                            </div>
                        <!-- POST END -->



                        
                    </div>
                <!-- POSTS END -->
            </div>
        </div>

    </div>
    <!-- MAIN CONTENT END -->


    <script>
        // INFINITE SCROLLING
        let currentPage = 1;
        let lastPage = 1;

        window.addEventListener("scroll", function(){
            const endOfPage = window.innerHeight + window.pageYOffset >= document.body.offsetHeight;
            console.log(endOfPage)
            if (endOfPage && currentPage < lastPage){
                currentPage = currentPage +1;
                loadContent(false, currentPage);
            }
        })





        setupUI();

        // FETCHING MAIN CONTENT
        let baseURL = "https://tarmeezacademy.com/api/v1";
        let postsURL = "https://tarmeezacademy.com/api/v1/posts";
        loadContent();


        function loadContent(reload= true, page= 1){
            axios.get(`${postsURL}?limit=5&page=${page}`).then((response)=>{

            const posts = response.data.data;
            lastPage = response.data.meta.last_page;

            if (reload){
                document.getElementById("posts").innerHTML = "";
            }

            let postTitle = '';
            let profileImage = './profile_pictures/spidy.jpg';

            for (post of posts){

                if (post.title != null) {
                    postTitle = post.title;
                }

                if (post.author.profile_image != null && post.author.profile_image !='' ){
                    profileImage = post.author.profile_image;
                }


                let content = 
                `
                        <!-- POST -->
                            <div class="card shadow">
                                <div class="card-header">
                                    <img src="${profileImage}" style="width: 40px; height: 40px;" class="border border-2 rounded-circle"/>
                                    <bold>@${post.author.username}</bold>
                                </div>
                                <div class="card-body" onclick="postClicked(${post.id})">
                                    <img src="${post.image}" class="w-100"/>
                                    <h6 style="color: rgb(170, 170, 170);">${post.created_at}</h6>
                                    <h4>${postTitle}</h4>
                                    <p>
                                        ${post.body}
                                    </p>
                                    
                                    <hr/>

                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pen" viewBox="0 0 16 16">
                                        <path d="m13.498.795.149-.149a1.207 1.207 0 1 1 1.707 1.708l-.149.148a1.5 1.5 0 0 1-.059 2.059L4.854 14.854a.5.5 0 0 1-.233.131l-4 1a.5.5 0 0 1-.606-.606l1-4a.5.5 0 0 1 .131-.232l9.642-9.642a.5.5 0 0 0-.642.056L6.854 4.854a.5.5 0 1 1-.708-.708L9.44.854A1.5 1.5 0 0 1 11.5.796a1.5 1.5 0 0 1 1.998-.001m-.644.766a.5.5 0 0 0-.707 0L1.95 11.756l-.764 3.057 3.057-.764L14.44 3.854a.5.5 0 0 0 0-.708z"/>
                                    </svg>

                                    <span>
                                       (${post.comments_count}) comments
                                    </span>

                                    <span id="post-tags-${post.id}">

                                    </span>
                                </div>
                            </div>
                        <!-- POST END -->
                `

                document.getElementById("posts").innerHTML += content;

                const currentPostTagId = `post-tags-${post.id}`;
                document.getElementById(currentPostTagId).innerHTML = "";
                
                for (tag of post.tags){
                    console.log(tag.name);
                    let tagsContent = `
                    <button class="btn btn-sm rounded-5" style="background-color: gray; color:white;"> ${tag.name}</button>
                    `;

                    document.getElementById(currentPostTagId).innerHTML += tagsContent;
                }


                
            }
        })
        }

        
  
        // LOGIN FUNCTION
        function loginBtnClicked(){

            const username = document.getElementById("username-login").value;
            const password = document.getElementById("password-login").value;

            const params = {"username": username, "password": password};
            
            axios.post(`${baseURL}/login`, params).then((response)=>{
                console.log(response.data);
                localStorage.setItem("token", response.data.token); // there were a problem when i said JSON.stringify and they said the reason is extra text when storing i guess
                localStorage.setItem("user", JSON.stringify(response.data.user));


                // for hiding the MODAL after logging in
                const modal = document.getElementById("login-modal");
                const modalInstance = bootstrap.Modal.getInstance(modal);
                modalInstance.hide();
                alertMessage("logged in successfuly", "success");
                setupUI();

            }).catch((error)=>{
                const message = error.response.data.message;
                alertMessage(message, "danger");
            })

        }


        // REGISTER FUNCTION
        function registerBtnClicked(){
            const username = document.getElementById("register-username-input").value;
            const password = document.getElementById("register-password-input").value;
            const name = document.getElementById("register-name-input").value;
            const email = document.getElementById("register-email-input").value;
            const image = document.getElementById("register-image-input").files[0];

            // const params = {"username": username, "password": password, "name":name, "email":email}; 


            let formData = new FormData();

            formData.append("name", name);
            formData.append("username", username);
            formData.append("image", image);
            formData.append("password", password);
            formData.append("email", email);


            const headers = {
                "Content-Type": "multipart/form-data",};


            // axios.post(`${baseURL}/posts`, formData, {headers: headers})

            
            axios.post(`${baseURL}/register`, formData, {headers: headers}).then((response)=>{
                console.log(response.data);
                localStorage.setItem("token", JSON.stringify(response.data.token));
                localStorage.setItem("user", JSON.stringify(response.data.user));


                // for hiding the MODAL after registering 
                const modal = document.getElementById("register-modal");
                const modalInstance = bootstrap.Modal.getInstance(modal);
                modalInstance.hide();
                alertMessage("signed up", "success");
                setupUI();

            }).catch((error)=>{
                console.log(error.response.data.message, error.response.data.errors.username);
                let error_message = error.response.data.message;
                alertMessage(error_message, "danger");
                
            })
        }


        // LOGOUT FUNCTION
        function logout(){
            localStorage.removeItem("token");
            localStorage.removeItem("user");

            setupUI();
        }


        // ALERT LOGIN SUCCESS (from bootstrap)
        function alertMessage(customMessage, type){
            const alertPlaceholder = document.getElementById('success-alert')
            const appendAlert = (message, type) => {
            const wrapper = document.createElement('div')
            wrapper.innerHTML = [
                `<div class="alert alert-${type} alert-dismissible" role="alert">`,
                `   <div>${message}</div>`,
                '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
                '</div>'
            ].join('')

            alertPlaceholder.append(wrapper)
            }

            appendAlert(customMessage, type)

            // todo: hiding the alert
            // setTimeout (()=>{
            //     const alert = bootstrap.Alert.getOrCreateInstance('#success-alert');
            // }, 2000)


        }
        
        // changing UI depending on sing in or not
        function setupUI(){
            
            const token = localStorage.getItem("token");

            const notLoggedInDIV= document.getElementById("not-logged-in-div");
            const loggedInDIV = document.getElementById("logged-in-div");

            // add post button
            const addPostBtn = document.getElementById("add-btn");

            if(token == null){
                notLoggedInDIV.style.setProperty("display", "flex", "important");
                loggedInDIV.style.setProperty("display", "none", "important");
                addPostBtn.style.setProperty("display", "none", "important");
            }else{
                notLoggedInDIV.style.setProperty("display", "none", "important");
                loggedInDIV.style.setProperty("display", "flex", "important");
                addPostBtn.style.setProperty("display", "block", "important");
                const user = getCurrentUser();
                document.getElementById("nav-username").innerHTML = user.username;
                document.getElementById("nav-user-image").src = user.profile_image;
            }

        }

        // create new post function
        function createNewPost(){
            const title = document.getElementById("post-title").value;
            const body = document.getElementById("post-body").value;
            let image = document.getElementById("post-image").files[0];

            let formData = new FormData();

            formData.append("body", body);
            formData.append("title", title);
            formData.append("image", image);

            const token = localStorage.getItem("token");
            const headers = {
                "Content-Type": "multipart/form-data",
                "authorization":`Bearer ${token}`};


            axios.post(`${baseURL}/posts`, formData, {headers: headers}).then((response)=>{
                console.log(response);
                 // for hiding the MODAL after  posting
                const modal = document.getElementById("add-new-post-modal");
                const modalInstance = bootstrap.Modal.getInstance(modal);
                modalInstance.hide();
                alertMessage("post created", "success");
                loadContent();
            }).catch((error)=>{
                const message = error.response.data.message;
                alertMessage(message, "danger");
            })

        }

        function getCurrentUser (){
            let user = null;
            const storageUser = localStorage.getItem("user");
            if (storageUser != null){
                user = JSON.parse(storageUser);
            }
            return user;        }


        // after clicking on a post to show details
        function postClicked(postId){
            window.location = `postDetails.html?postId=${postId}`;
            //alert(postId); // للتأكد فقط 
            }
    </script>

</body>
</html>
